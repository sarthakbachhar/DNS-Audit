version: "3.9"

services:

  # ── MySQL database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql@toor
      MYSQL_DATABASE: iso_audit
    volumes:
      - mysql_data:/var/lib/mysql      # data survives container restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql@toor"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Flask application ────────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"          # access at http://localhost:5000
    environment:
      DB_HOST:     db         # "db" is the service name above — Docker resolves it
      DB_PORT:     3306
      DB_USER:     root
      DB_PASSWORD: mysql@toor
      DB_NAME:     iso_audit
      FLASK_HOST:  0.0.0.0   # must listen on all interfaces inside the container
      SECRET_KEY:  change-this-in-production
    volumes:
      - app_reports:/app/reports   # persist generated reports
      - app_logs:/app/logs         # persist log files
    depends_on:
      db:
        condition: service_healthy  # don't start until MySQL is ready

volumes:
  mysql_data:    # MySQL data directory
  app_reports:   # PDF/HTML audit reports
  app_logs:      # application logs

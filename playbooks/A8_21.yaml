# ============================================================
# A.8.21 - Security of Network Services
# ============================================================
# Checks LDAP signing, SMB signing, and channel binding.

control: "A.8.21"
control_name: "Security of Network Services"

checks:
  - id: "A.8.21.1"
    title: "LDAP Server Signing Required"
    description: "LDAP server signing should be required to prevent LDAP relay attacks and ensure data integrity."
    severity: "high"
    powershell: |
      $regPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters'
      $value = Get-ItemProperty -Path $regPath -Name 'LDAPServerIntegrity' -ErrorAction SilentlyContinue
      if ($value -and $value.LDAPServerIntegrity -eq 2) { "True" } else { "False" }
    check:
      operator: "is_true"
      expected: "True"
    remediation: |
      1. Configure via GPO:
         Computer Configuration > Policies > Windows Settings > Security Settings >
         Local Policies > Security Options
         "Domain controller: LDAP server signing requirements" = "Require signing"
      2. Or via registry:
         Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters' -Name 'LDAPServerIntegrity' -Value 2
      3. WARNING: Ensure all LDAP clients support signing before enforcing

  - id: "A.8.21.2"
    title: "SMB Signing Required"
    description: "SMB signing should be required on Domain Controllers to prevent man-in-the-middle attacks on SMB communications."
    severity: "high"
    powershell: |
      $regPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $value = Get-ItemProperty -Path $regPath -Name 'RequireSecuritySignature' -ErrorAction SilentlyContinue
      if ($value -and $value.RequireSecuritySignature -eq 1) { "True" } else { "False" }
    check:
      operator: "is_true"
      expected: "True"
    remediation: |
      1. Configure via GPO:
         Computer Configuration > Windows Settings > Security Settings >
         Local Policies > Security Options
         "Microsoft network server: Digitally sign communications (always)" = Enabled
      2. Or via registry:
         Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -Name 'RequireSecuritySignature' -Value 1
      3. Run: gpupdate /force

  - id: "A.8.21.3"
    title: "LDAP Channel Binding Configured"
    description: "LDAP channel binding should be configured to mitigate LDAP relay attacks."
    severity: "high"
    powershell: |
      $regPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters'
      $value = Get-ItemProperty -Path $regPath -Name 'LdapEnforceChannelBinding' -ErrorAction SilentlyContinue
      if ($value -and $value.LdapEnforceChannelBinding -ge 1) { "True" } else { "False" }
    check:
      operator: "is_true"
      expected: "True"
    remediation: |
      1. Set LDAP channel binding token requirement:
         Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters' -Name 'LdapEnforceChannelBinding' -Value 2
      2. Values: 0 = Never, 1 = When supported, 2 = Always
      3. WARNING: Test with value 1 before enforcing with 2
      4. Ensure all clients support channel binding
